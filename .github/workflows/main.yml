name: CI
env:
  FORCE_COLOR: 2
  NODE: 14
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional jest test name/path filter'
        required: false
        default: ''
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: yarn
      - run: yarn install
      - run: yarn lint
      - run: yarn typecheck
  regression:
    name: Test regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: yarn
      - run: yarn install
      - run: yarn test-regression
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 16
          - 14
          - 12
          - 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: yarn install
      - run: yarn test ${{ inputs.test-filter }}
      - run: yarn test-browser
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - run: yarn install
      - run: rm -rf dist && yarn rollup -c
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: svgo-tgz
          path: svgo-*.tgz
          if-no-files-found: error
